<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Amir Mohammadisarab</title>
<desc id="d">AI Engineer, Robotics Engineer, MLOps Engineer. Cooperative perception, V2X fusion, LLM reasoning and reproducible ML.</desc>
<style>
  .sans { font-family: 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace; }
  .ring { transform-box: fill-box; transform-origin: center; opacity: .28; }
  .r2 { transform: scale(.55); }
  @media (prefers-reduced-motion: no-preference) {
    .ring { animation: ping 3.6s cubic-bezier(.2,.6,.3,1) infinite; }
    .r2 { animation-delay: 1.8s; }
    .flow { animation: flow 1.2s linear infinite; }
    .ghost { animation: ghost 6s ease-in-out infinite; }
  }
  @keyframes ping { 0% { transform: scale(.12); opacity: .75; } 80% { opacity: .06; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  @keyframes ghost { 0%, 10% { opacity: 0; } 18%, 60% { opacity: 1; } 72%, 100% { opacity: 0; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#121a2e"/>
  </linearGradient>
  <linearGradient id="accent" x1="64" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="v2x" x1="205" y1="120" x2="106" y2="208" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fade" cx=".5" cy=".5" r=".5">
    <stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
  <mask id="m" maskUnits="userSpaceOnUse" x="-40" y="0" width="480" height="320">
    <rect x="-40" y="0" width="480" height="320" fill="url(#fade)"/>
  </mask>
</defs>

<g clip-path="url(#card)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="1040" cy="160" rx="300" ry="220" fill="url(#glow)"/>
  <ellipse cx="160" cy="40" rx="320" ry="160" fill="url(#glow)" opacity=".55"/>

  <!-- cooperative perception scene: ego (cyan) gets a V2X object from a CAV (indigo); a ghost appears and is rejected -->
  <g transform="translate(840 0)">
    <g mask="url(#m)">
      <rect x="-40" y="178" width="480" height="56" fill="#172036"/>
      <rect x="200" y="-10" width="56" height="340" fill="#172036"/>
      <path d="M-40 206H200M256 206H440M228 -10V178M228 234V330" stroke="#2c3a57" stroke-width="2" stroke-dasharray="10 10"/>

      <g fill="#0e1524" stroke="#1f2a40">
        <rect x="20" y="26" width="164" height="136" rx="12"/>
        <rect x="272" y="26" width="120" height="136" rx="12"/>
        <rect x="20" y="250" width="164" height="60" rx="12"/>
        <rect x="272" y="250" width="120" height="60" rx="12"/>
      </g>
      <g fill="#121b2e">
        <rect x="32" y="38" width="64" height="52" rx="7"/>
        <rect x="106" y="38" width="66" height="112" rx="7"/>
        <rect x="32" y="100" width="64" height="50" rx="7"/>
        <rect x="284" y="38" width="96" height="112" rx="7"/>
        <rect x="32" y="262" width="140" height="36" rx="7"/>
        <rect x="284" y="262" width="96" height="36" rx="7"/>
      </g>

      <!-- sensing ranges -->
      <circle class="ring" cx="104" cy="220" r="96" fill="none" stroke="#22d3ee" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <circle class="ring r2" cx="104" cy="220" r="96" fill="none" stroke="#22d3ee" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <circle cx="214" cy="118" r="74" fill="none" stroke="#818cf8" stroke-opacity=".35" stroke-dasharray="3 6"/>

      <!-- V2X link -->
      <path d="M205 120C150 122 108 160 106 208" fill="none" stroke="url(#v2x)" stroke-opacity=".25" stroke-width="1.5"/>
      <path class="flow" d="M205 120C150 122 108 160 106 208" fill="none" stroke="url(#v2x)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text class="mono" x="126" y="140" text-anchor="end" font-size="12" letter-spacing="1" fill="#818cf8">V2X</text>

      <!-- vehicles -->
      <rect x="300" y="184" width="36" height="17" rx="5" fill="#64748b" opacity=".6"/>
      <rect x="304" y="186.5" width="6" height="12" rx="1.5" fill="#0a0e17" opacity=".5"/>

      <rect x="233" y="40" width="18" height="36" rx="5" fill="#64748b"/>
      <rect x="235.5" y="44" width="13" height="6" rx="1.5" fill="#0a0e17" opacity=".5"/>
      <path d="M227 42V34H235M249 34H257V42M257 74V82H249M235 82H227V74" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

      <rect x="205" y="100" width="18" height="36" rx="5" fill="#818cf8"/>
      <rect x="207.5" y="126" width="13" height="6" rx="1.5" fill="#0a0e17" opacity=".5"/>

      <rect x="86" y="211" width="36" height="18" rx="5" fill="#22d3ee"/>
      <rect x="110" y="213.5" width="6" height="13" rx="1.5" fill="#0a0e17" opacity=".5"/>

      <!-- ghost object: a duplicate that lands inside a building, rejected -->
      <g class="ghost">
        <rect x="264" y="66" width="24" height="38" rx="5" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M270 79L282 91M282 79L270 91" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
        <text class="mono" x="264" y="120" font-size="11" letter-spacing="1" fill="#f87171">ghost</text>
      </g>
    </g>
  </g>

  <!-- text -->
  <text class="mono" x="64" y="96" font-size="15" letter-spacing="3" fill="#22d3ee">PHD RESEARCHER · UWICORE LAB · ELCHE, SPAIN</text>
  <text class="sans" x="62" y="160" font-size="56" font-weight="800" letter-spacing="-1" fill="#f1f5f9">Amir Mohammadisarab</text>
  <text class="sans" x="64" y="204" font-size="25" font-weight="600" fill="url(#accent)">AI Engineer  ·  Robotics Engineer  ·  MLOps Engineer</text>
  <text class="mono" x="64" y="246" font-size="16" fill="#94a3b8">cooperative perception · V2X fusion · LLM reasoning · reproducible ML</text>
</g>
<rect x=".5" y=".5" width="1279" height="319" rx="19.5" fill="none" stroke="#1e293b"/>
</svg>
